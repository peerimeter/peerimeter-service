name: Service CI and image release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: peerimeter-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: peerimeter
          POSTGRES_PASSWORD: peerimeter-test-only
          POSTGRES_DB: peerimeter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerimeter -d peerimeter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PEERIMETER_TEST_DATABASE_URL: postgres://peerimeter:peerimeter-test-only@localhost:5432/peerimeter_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(rg --files -g '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build binary
        run: go build -trimpath -o /tmp/peerimeter-service ./cmd/peerimeter-service
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build container image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: peerimeter-service:ci
          load: true

  action-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install GitHub Actions lock verifier
        run: gh extension install github/gh-actions-lock
      - name: Verify locked action dependencies
        run: gh actions-lock --verify

  check:
    name: check
    if: always()
    needs: [verify, action-lock]
    runs-on: ubuntu-24.04
    steps:
      - name: Require service checks to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          ACTION_LOCK_RESULT: ${{ needs.action-lock.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$ACTION_LOCK_RESULT" = success

  seed-version:
    if: github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the initial SemVer baseline when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          if [[ -z "$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)" ]]; then
            BASE_COMMIT="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/v0.0.0 -f sha="$BASE_COMMIT"
          fi

  version:
    if: github.ref == 'refs/heads/main'
    needs: [seed-version]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release_version.outputs.next }}
      bump: ${{ steps.release_version.outputs.bump }}
      breaking: ${{ steps.release_version.outputs.breaking }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semver
        name: Calculate next version from Conventional Commits
        uses: ietf-tools/semver-action@v1.12.0
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: current
          noVersionBumpBehavior: current
      - id: release_version
        name: Keep breaking changes on the next 0.x minor release
        env:
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          BUMP: ${{ steps.semver.outputs.bump }}
        run: |
          if [[ "$CURRENT" =~ ^v0\.([0-9]+)\.[0-9]+$ && "$BUMP" == major ]]; then
            echo "next=v0.$((BASH_REMATCH[1] + 1)).0" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "next=$NEXT" >> "$GITHUB_OUTPUT"
            echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            if [[ "$BUMP" == major ]]; then
              echo "breaking=true" >> "$GITHUB_OUTPUT"
            else
              echo "breaking=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  release-image:
    if: github.ref == 'refs/heads/main' && (needs.version.outputs.bump == 'major' || needs.version.outputs.bump == 'minor' || needs.version.outputs.bump == 'patch')
    needs: [check, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION_TAG: ${{ needs.version.outputs.tag }}
      BREAKING_RELEASE: ${{ needs.version.outputs.breaking }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
      - id: image-tags
        name: Prepare versioned image tags
        run: |
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "versionless=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push versioned image to GHCR
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION_TAG }}
            ${{ env.IMAGE }}:${{ steps.image-tags.outputs.versionless }}
          build-args: SERVICE_VERSION=${{ env.VERSION_TAG }}
      - name: Create version tag and GitHub release
        run: |
          if EXISTING_TAG="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_TAG" --jq .object.sha 2>/dev/null)"; then
            [[ "$EXISTING_TAG" == "$GITHUB_SHA" ]]
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$VERSION_TAG" -f sha="$GITHUB_SHA"
          fi
          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$VERSION_TAG" --jq .body > release-notes.md
            if [[ "$BREAKING_RELEASE" == true ]]; then
              { printf '## Breaking changes included\n\nThis release includes backward-incompatible changes. Review the linked pull requests for compatibility details and upgrade instructions.\n\n'; cat release-notes.md; } > release-notes-with-warning.md
              mv release-notes-with-warning.md release-notes.md
            fi
            gh release create "$VERSION_TAG" --verify-tag --notes-file release-notes.md --title "$VERSION_TAG"
          fi
      - name: Promote latest image tag only for the newest release
        run: |
          git fetch --tags --force
          newest_version="$(git tag --list 'v[0-9]*' | sort -V | tail -n 1)"
          if [[ "$VERSION_TAG" != "$newest_version" ]]; then
            echo "Skipping latest promotion; $newest_version is newer than $VERSION_TAG."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION_TAG"
