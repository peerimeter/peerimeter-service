name: Service CI and image release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: peerimeter-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(rg --files -g '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build binary
        run: go build -trimpath -o /tmp/peerimeter-service ./cmd/peerimeter-service
      - name: Build container image
        run: docker build --tag peerimeter-service:ci .

  action-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install GitHub Actions lock verifier
        run: gh extension install github/gh-actions-lock
      - name: Verify locked action dependencies
        run: gh actions-lock --verify

  check:
    name: check
    if: always()
    needs: [verify, action-lock]
    runs-on: ubuntu-24.04
    steps:
      - name: Require service checks to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          ACTION_LOCK_RESULT: ${{ needs.action-lock.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$ACTION_LOCK_RESULT" = success

  seed-version:
    if: github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the initial SemVer baseline when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          if [[ -z "$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)" ]]; then
            BASE_COMMIT="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/v0.0.0 -f sha="$BASE_COMMIT"
          fi

  version:
    if: github.ref == 'refs/heads/main'
    needs: [seed-version]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semver.outputs.next }}
      bump: ${{ steps.semver.outputs.bump }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: semver
        name: Calculate next version from Conventional Commits
        uses: ietf-tools/semver-action@v1.12.0
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

  publish-image:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build and push versioned image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$VERSION_TAG" \
            --tag "$IMAGE:${VERSION_TAG#v}" \
            --push .

  release-image:
    if: github.ref == 'refs/heads/main' && (needs.version.outputs.bump == 'major' || needs.version.outputs.bump == 'minor' || needs.version.outputs.bump == 'patch')
    needs: [check, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build and push versioned image to GHCR
        run: |
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$VERSION_TAG" \
            --tag "$IMAGE:${VERSION_TAG#v}" \
            --push .
      - name: Create version tag and GitHub release
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$VERSION_TAG" -f sha="$GITHUB_SHA"
          gh release create "$VERSION_TAG" --verify-tag --generate-notes --title "$VERSION_TAG"
