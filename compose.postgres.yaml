services:
  peerimeter-service:
    environment:
      PEERIMETER_STORAGE_BACKEND: postgres
      PEERIMETER_DATABASE_URL: ${PEERIMETER_DATABASE_URL:-postgres://${POSTGRES_USER:-peerimeter}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-peerimeter}?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peerimeter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-peerimeter}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
